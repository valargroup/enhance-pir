name: Deploy Enhance PIR

on:
  workflow_dispatch:
    inputs:
      ref:
        description: Full commit SHA on main with a successful CI run
        required: true
        type: string
      allow_topology_change:
        description: Accept a non-append worker inventory change
        required: false
        default: false
        type: boolean

permissions:
  contents: read

concurrency:
  group: enhance-production
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy production fleet
    runs-on: [self-hosted, Linux, X64, enhance-pir-deploy]
    timeout-minutes: 60
    environment: production
    permissions:
      actions: read
      contents: read
    steps:
      - name: Verify tested revision
        env:
          GH_TOKEN: ${{ github.token }}
          SHA: ${{ inputs.ref }}
        run: |
          set -euo pipefail
          [[ "$SHA" =~ ^[0-9a-f]{40}$ ]]
          api_headers=(
            --header "Authorization: Bearer ${GH_TOKEN}"
            --header 'Accept: application/vnd.github+json'
            --header 'X-GitHub-Api-Version: 2022-11-28'
          )
          main_sha="$(curl --fail --silent --show-error "${api_headers[@]}" \
            "${GITHUB_API_URL}/repos/${GITHUB_REPOSITORY}/git/ref/heads/main" | jq -er '.object.sha')"
          [[ "$SHA" == "$main_sha" ]]
          successful="$(curl --fail --silent --show-error "${api_headers[@]}" \
            "${GITHUB_API_URL}/repos/${GITHUB_REPOSITORY}/actions/workflows/ci.yml/runs?head_sha=${SHA}&status=success&per_page=1" \
            | jq -er '.workflow_runs | length')"
          [[ "$successful" -ge 1 ]]
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref }}
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.91.0
      - name: Build release binaries
        env:
          RUSTFLAGS: -C target-cpu=x86-64-v3
        run: cargo build --locked --release -p enhance-pir-server -p enhance-pir -p pir-apm --bins --features enhance-pir/cli
      - name: Assemble checksummed artifact
        run: |
          set -euo pipefail
          mkdir artifact
          install -m 0755 target/release/enhance-pir-server artifact/
          install -m 0755 target/release/enhance-pir-worker artifact/
          install -m 0755 target/release/enhance-pir-cli artifact/
          install -m 0755 target/release/pir-apm artifact/
          cp ops/infra/digitalocean/production/deploy/enhance-pir-server.service artifact/
          cp ops/infra/digitalocean/production/deploy/enhance-pir-worker.service artifact/
          cp ops/infra/digitalocean/production/deploy/pir-apm.service artifact/
          cp ops/infra/digitalocean/production/deploy/Caddyfile artifact/
          printf '%s\n' '${{ inputs.ref }}' >artifact/revision
          (cd artifact && sha256sum ./* >SHA256SUMS)
      - uses: actions/upload-artifact@v4
        with:
          name: enhance-pir-${{ inputs.ref }}
          path: artifact/
          if-no-files-found: error
          retention-days: 14
      - name: Prepare ephemeral SSH material
        env:
          DEPLOY_SSH_KEY: ${{ secrets.ENHANCE_DEPLOY_SSH_KEY }}
          KNOWN_HOSTS: ${{ vars.ENHANCE_SSH_KNOWN_HOSTS }}
        run: |
          set -euo pipefail
          : "${DEPLOY_SSH_KEY:?production deployment SSH key is empty}"
          install -m 0700 -d "$RUNNER_TEMP/enhance-pir-ssh"
          printf '%s\n' "$DEPLOY_SSH_KEY" >"$RUNNER_TEMP/enhance-pir-ssh/key"
          printf '%s\n' "$KNOWN_HOSTS" >"$RUNNER_TEMP/enhance-pir-ssh/known_hosts"
          chmod 0600 "$RUNNER_TEMP/enhance-pir-ssh/key" "$RUNNER_TEMP/enhance-pir-ssh/known_hosts"
      - name: Deploy and verify
        env:
          ENHANCE_COORDINATOR_HOST: ${{ vars.ENHANCE_COORDINATOR_HOST }}
          ENHANCE_DEPLOY_USER: ${{ vars.ENHANCE_DEPLOY_USER }}
          ENHANCE_PUBLIC_URL: ${{ vars.ENHANCE_PUBLIC_URL }}
          ENHANCE_WORKERS_JSON: ${{ vars.ENHANCE_WORKERS_JSON }}
          ENHANCE_RELEASE_SHA: ${{ inputs.ref }}
          ENHANCE_ARTIFACT_DIR: ${{ github.workspace }}/artifact
          ENHANCE_SSH_KEY_PATH: ${{ runner.temp }}/enhance-pir-ssh/key
          ENHANCE_KNOWN_HOSTS_PATH: ${{ runner.temp }}/enhance-pir-ssh/known_hosts
          ENHANCE_SERVER_SERVICE_FILE: ${{ github.workspace }}/artifact/enhance-pir-server.service
          ENHANCE_WORKER_SERVICE_FILE: ${{ github.workspace }}/artifact/enhance-pir-worker.service
          ENHANCE_APM_SERVICE_FILE: ${{ github.workspace }}/artifact/pir-apm.service
          ENHANCE_CADDYFILE: ${{ github.workspace }}/artifact/Caddyfile
          ENHANCE_APM_ENVIRONMENT: production
          ENHANCE_ALLOW_TOPOLOGY_CHANGE: ${{ inputs.allow_topology_change }}
          PIR_APM_SLACK_WEBHOOK_URL: ${{ secrets.PIR_APM_SLACK_WEBHOOK_URL }}
        run: ops/scripts/deploy-enhance-pir.sh deploy
      - name: Deployment summary
        if: always()
        run: |
          {
            echo '## Enhance PIR production deployment'
            echo
            echo '- Revision: ${{ inputs.ref }}'
            echo '- Endpoint: ${{ vars.ENHANCE_PUBLIC_URL }}'
          } >>"$GITHUB_STEP_SUMMARY"
      - name: Remove SSH material
        if: always()
        run: |
          rm -f "$RUNNER_TEMP/enhance-pir-ssh/key" "$RUNNER_TEMP/enhance-pir-ssh/known_hosts"
          rmdir "$RUNNER_TEMP/enhance-pir-ssh" 2>/dev/null || true
