name: Deploy memo PIR fleet

on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]
  workflow_dispatch:
    inputs:
      ref:
        description: Full commit SHA on main with a successful CI run
        required: true
        type: string
      preflight_only:
        description: Upload and verify artifacts without restarting services
        required: true
        default: true
        type: boolean

permissions:
  contents: read

concurrency:
  group: memo-pir-mainnet-poc
  cancel-in-progress: false

jobs:
  resolve:
    name: Resolve tested revision
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.head_branch == 'main' &&
       github.event.workflow_run.head_repository.full_name == github.repository)
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
    outputs:
      sha: ${{ steps.revision.outputs.sha }}
      deploy: ${{ steps.revision.outputs.deploy }}
    steps:
      - name: Resolve and verify revision
        id: revision
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT_NAME: ${{ github.event_name }}
          AUTOMATIC_SHA: ${{ github.event.workflow_run.head_sha }}
          REQUESTED_SHA: ${{ inputs.ref }}
        run: |
          set -euo pipefail
          if [[ "$EVENT_NAME" == "workflow_run" ]]; then
            sha="$AUTOMATIC_SHA"
            main_sha="$(gh api "repos/${GITHUB_REPOSITORY}/git/ref/heads/main" --jq .object.sha)"
            if [[ "$sha" != "$main_sha" ]]; then
              echo "Skipping stale successful CI revision $sha; main is now $main_sha"
              echo "sha=$sha" >>"$GITHUB_OUTPUT"
              echo "deploy=false" >>"$GITHUB_OUTPUT"
              exit 0
            fi
          else
            sha="$REQUESTED_SHA"
            [[ "$sha" =~ ^[0-9a-f]{40}$ ]]
            main_sha="$(gh api "repos/${GITHUB_REPOSITORY}/git/ref/heads/main" --jq .object.sha)"
            gh api "repos/${GITHUB_REPOSITORY}/compare/${sha}...${main_sha}" \
              --jq 'select(.status == "ahead" or .status == "identical")' >/dev/null
            successful="$(gh api \
              "repos/${GITHUB_REPOSITORY}/actions/workflows/ci.yml/runs?head_sha=${sha}&status=success&per_page=1" \
              --jq '.workflow_runs | length')"
            [[ "$successful" -ge 1 ]]
          fi
          echo "sha=$sha" >>"$GITHUB_OUTPUT"
          echo "deploy=true" >>"$GITHUB_OUTPUT"

  build:
    name: Build memo PIR release
    needs: resolve
    if: needs.resolve.outputs.deploy == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout tested revision
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ needs.resolve.outputs.sha }}
          persist-credentials: false

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c
        with:
          toolchain: 1.91.0

      - name: Cache Rust build
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: |
            target
            ~/.cargo/registry
            ~/.cargo/git
          key: ${{ runner.os }}-memo-pir-rust-1.91.0-${{ hashFiles('Cargo.lock') }}
          restore-keys: ${{ runner.os }}-memo-pir-rust-1.91.0-

      - name: Build release binaries
        env:
          RUSTFLAGS: -C target-cpu=x86-64-v3
        run: cargo build --locked --release -p memo-pir --bins

      - name: Assemble checksummed artifact
        env:
          RELEASE_SHA: ${{ needs.resolve.outputs.sha }}
        run: |
          set -euo pipefail
          mkdir artifact
          install -m 0755 target/release/memo-pir-server artifact/
          install -m 0755 target/release/memo-pir-worker artifact/
          install -m 0755 target/release/memo-pir-cli artifact/
          cp infra/digitalocean/memo-poc/deploy/memo-pir-server.service artifact/
          cp infra/digitalocean/memo-poc/deploy/memo-pir-worker.service artifact/
          printf '%s\n' "$RELEASE_SHA" >artifact/revision
          (cd artifact && sha256sum memo-pir-* revision >SHA256SUMS)

      - name: Upload deployment artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: memo-pir-${{ needs.resolve.outputs.sha }}
          path: artifact/
          if-no-files-found: error
          retention-days: 14

  deploy:
    name: Deploy coordinated fleet
    needs: [resolve, build]
    runs-on: ubuntu-latest
    timeout-minutes: 60
    environment:
      name: memo-pir-mainnet-poc
      url: ${{ vars.MEMO_PUBLIC_URL }}
    permissions:
      actions: read
      contents: read
      deployments: write
    steps:
      - name: Checkout deployment tooling
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ needs.resolve.outputs.sha }}
          persist-credentials: false

      - name: Download release artifact
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: memo-pir-${{ needs.resolve.outputs.sha }}
          path: artifact

      - name: Verify artifact checksums
        run: |
          set -euo pipefail
          (cd artifact && sha256sum --check SHA256SUMS)
          chmod 0755 \
            artifact/memo-pir-server \
            artifact/memo-pir-worker \
            artifact/memo-pir-cli

      - name: Prepare ephemeral SSH material
        env:
          DEPLOY_SSH_KEY: ${{ secrets.MEMO_DEPLOY_SSH_KEY }}
          KNOWN_HOSTS: ${{ vars.MEMO_SSH_KNOWN_HOSTS }}
        run: |
          set -euo pipefail
          : "${DEPLOY_SSH_KEY:?GitHub Environment secret MEMO_DEPLOY_SSH_KEY is empty}"
          install -m 0700 -d "$RUNNER_TEMP/memo-pir-ssh"
          printf '%s\n' "$DEPLOY_SSH_KEY" >"$RUNNER_TEMP/memo-pir-ssh/key"
          printf '%s\n' "$KNOWN_HOSTS" >"$RUNNER_TEMP/memo-pir-ssh/known_hosts"
          chmod 0600 "$RUNNER_TEMP/memo-pir-ssh/key" "$RUNNER_TEMP/memo-pir-ssh/known_hosts"

      - name: Validate topology and deploy
        env:
          MEMO_COORDINATOR_HOST: ${{ vars.MEMO_COORDINATOR_HOST }}
          MEMO_DEPLOY_USER: ${{ vars.MEMO_DEPLOY_USER }}
          MEMO_PUBLIC_URL: ${{ vars.MEMO_PUBLIC_URL }}
          MEMO_WORKERS_JSON: ${{ vars.MEMO_WORKERS_JSON }}
          MEMO_RELEASE_SHA: ${{ needs.resolve.outputs.sha }}
          MEMO_ARTIFACT_DIR: ${{ github.workspace }}/artifact
          MEMO_SSH_KEY_PATH: ${{ runner.temp }}/memo-pir-ssh/key
          MEMO_KNOWN_HOSTS_PATH: ${{ runner.temp }}/memo-pir-ssh/known_hosts
          MEMO_SERVER_SERVICE_FILE: ${{ github.workspace }}/artifact/memo-pir-server.service
          MEMO_WORKER_SERVICE_FILE: ${{ github.workspace }}/artifact/memo-pir-worker.service
          PREFLIGHT_ONLY: ${{ inputs.preflight_only }}
        run: |
          set -euo pipefail
          mode=deploy
          if [[ "$GITHUB_EVENT_NAME" == "workflow_dispatch" && "$PREFLIGHT_ONLY" == "true" ]]; then
            mode=preflight
          fi
          scripts/deploy-memo-pir.sh "$mode"

      - name: Deployment summary
        if: always()
        env:
          RELEASE_SHA: ${{ needs.resolve.outputs.sha }}
          PUBLIC_URL: ${{ vars.MEMO_PUBLIC_URL }}
        run: |
          {
            echo "## Memo PIR deployment"
            echo
            echo "- Revision: $RELEASE_SHA"
            echo "- Endpoint: $PUBLIC_URL"
            echo "- Event: $GITHUB_EVENT_NAME"
          } >>"$GITHUB_STEP_SUMMARY"
