name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -Dwarnings -C target-cpu=x86-64-v3

jobs:
  changes:
    name: Detect changes
    runs-on: ubuntu-latest
    outputs:
      shared: ${{ steps.filter.outputs.shared }}
      nullifier: ${{ steps.filter.outputs.nullifier }}
      witness: ${{ steps.filter.outputs.witness }}
      code: ${{ steps.filter.outputs.code }}
      memo: ${{ steps.filter.outputs.memo }}
      memo_deploy: ${{ steps.filter.outputs.memo_deploy }}
    steps:
      - uses: actions/checkout@v4
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            shared:
              - 'shared/**'
              - 'proto/**'
              - 'Cargo.toml'
              - 'Cargo.lock'
              - 'rust-toolchain.toml'
            nullifier:
              - 'nullifier/**'
            witness:
              - 'witness/**'
            code:
              - '**/*.rs'
              - '**/*.toml'
              - 'Cargo.lock'
              - 'rust-toolchain.toml'
              - 'proto/**'
              - '.github/workflows/ci.yml'
            memo:
              - 'memo/**'
              - 'deploy/pir-apm/**'
            memo_deploy:
              - '.github/actionlint.yaml'
              - 'scripts/deploy-memo-pir.sh'
              - '.github/workflows/deploy-pir-fleet.yml'
              - 'infra/digitalocean/production/deploy/memo-pir-*.service'
              - 'infra/digitalocean/production/deploy/pir-apm.service'
              - 'infra/digitalocean/production/deploy/Caddyfile'

  validate-memo-deploy:
    name: Validate memo deployment tooling
    needs: changes
    if: needs.changes.outputs.memo_deploy == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check deployment shell
        run: shellcheck scripts/deploy-memo-pir.sh
      - name: Validate example inventory
        env:
          MEMO_COORDINATOR_HOST: coordinator.example.net
          MEMO_DEPLOY_USER: deploy
          MEMO_PUBLIC_URL: https://memo.example.net
          MEMO_WORKERS_JSON: >-
            [{"name":"worker-1","ssh_host":"worker-1.example.net","service_url":"http://10.0.0.2:8091"},{"name":"worker-2","ssh_host":"worker-2.example.net","service_url":"http://10.0.0.3:8091"}]
        run: scripts/deploy-memo-pir.sh validate

  lint:
    name: Lint
    needs: changes
    if: needs.changes.outputs.code == 'true' || github.event_name == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.91.0
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - name: Install protoc
        uses: arduino/setup-protoc@v3
        with:
          repo-token: ${{ secrets.GITHUB_TOKEN }}
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets --all-features

  test-nullifier:
    name: Test (nullifier)
    needs: changes
    if: needs.changes.outputs.shared == 'true' || needs.changes.outputs.nullifier == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.91.0
      - uses: Swatinem/rust-cache@v2
        with:
          key: nullifier
      - name: Install protoc
        uses: arduino/setup-protoc@v3
        with:
          repo-token: ${{ secrets.GITHUB_TOKEN }}
      - run: >-
          cargo test
          -p pir-types
          -p chain-ingest
          -p spend-types
          -p hashtable-pir
          -p nf-ingest
          -p spend-server
          -p spend-client

  test-witness:
    name: Test (witness)
    needs: changes
    if: needs.changes.outputs.shared == 'true' || needs.changes.outputs.witness == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.91.0
      - uses: Swatinem/rust-cache@v2
        with:
          key: witness
      - name: Install protoc
        uses: arduino/setup-protoc@v3
        with:
          repo-token: ${{ secrets.GITHUB_TOKEN }}
      # No --lib needed: the mainnet tests self-skip unless PIR_SLOW_TESTS is
      # set (see CLAUDE.md), so the integration tests here are hermetic and the
      # mock-lightwalletd coverage that --lib used to discard now runs.
      - name: Unit + hermetic integration tests (witness crates)
        run: >-
          cargo test
          -p pir-types
          -p chain-ingest
          -p witness-types
          -p commitment-ingest
          -p commitment-tree-db
          -p witness-server
          -p witness-client

  test-memo:
    name: Test (memo)
    needs: changes
    if: needs.changes.outputs.shared == 'true' || needs.changes.outputs.memo == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.91.0
      - uses: Swatinem/rust-cache@v2
        with:
          key: memo
      - uses: arduino/setup-protoc@v3
        with:
          repo-token: ${{ secrets.GITHUB_TOKEN }}
      # Release: the round-trip tests preprocess full 8,192-row shards, which is
      # minutes of NTT work in a debug build.
      - run: cargo test -p memo-pir -p pir-apm --release

  test-tree-correctness:
    name: Test (tree correctness)
    needs: changes
    if: github.event_name == 'push' && (needs.changes.outputs.shared == 'true' || needs.changes.outputs.witness == 'true')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # Required: these tests self-skip without it and the job would pass on nothing.
    env:
      PIR_SLOW_TESTS: 1
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.91.0
      - uses: Swatinem/rust-cache@v2
        with:
          key: witness
      - name: Install protoc
        uses: arduino/setup-protoc@v3
        with:
          repo-token: ${{ secrets.GITHUB_TOKEN }}
      - name: Verify shard root against mainnet
        run: >-
          cargo test
          -p commitment-tree-db
          -p witness-server
          --test tree_correctness
          --release
          -- --nocapture

  test-pir-round-trip:
    name: Test (PIR round-trip)
    needs: changes
    if: github.event_name == 'push' && (needs.changes.outputs.shared == 'true' || needs.changes.outputs.witness == 'true')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      PIR_TEST_DATA_DIR: /tmp/pir-test-snapshot
      # Required: the test self-skips without it and the job would pass on nothing.
      PIR_SLOW_TESTS: 1
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.91.0
      - uses: Swatinem/rust-cache@v2
        with:
          cache-on-failure: true
          key: pir-round-trip
      - uses: actions/cache@v4
        with:
          path: /tmp/pir-test-snapshot
          key: pir-snapshot-v2-${{ runner.os }}-${{ hashFiles('Cargo.lock', 'witness/witness-server/src/server.rs', 'witness/witness-server/src/state.rs', 'witness/witness-server/tests/pir_round_trip.rs') }}
          restore-keys: pir-snapshot-v2-${{ runner.os }}-
      - name: Install protoc
        uses: arduino/setup-protoc@v3
        with:
          repo-token: ${{ secrets.GITHUB_TOKEN }}
      - name: PIR round-trip test
        run: >-
          cargo test
          -p witness-server
          --test pir_round_trip
          --features ypir
          --release
          -- --nocapture

  test-ypir:
    name: Test (YPIR)
    needs: changes
    if: github.event_name == 'push' && (needs.changes.outputs.shared == 'true' || needs.changes.outputs.nullifier == 'true')
    runs-on: ubuntu-latest
    timeout-minutes: 20
    # Required: the gated tests self-skip without it.
    env:
      PIR_SLOW_TESTS: 1
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.91.0
      - uses: Swatinem/rust-cache@v2
        with:
          key: ypir
      - name: Install protoc
        uses: arduino/setup-protoc@v3
        with:
          repo-token: ${{ secrets.GITHUB_TOKEN }}
      # Without --lib this actually exercises the YPIR/IPIR round-trips; with
      # --lib the job paid for a full all-features release build and then ran
      # only the unit tests, which the other jobs already cover.
      - run: cargo test --workspace --all-features --release

  test-ipir:
    name: Test (IPIR)
    needs: changes
    if: github.event_name == 'push' || needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.91.0
      - uses: Swatinem/rust-cache@v2
        with:
          key: ipir
      - name: Install protoc
        uses: arduino/setup-protoc@v3
        with:
          repo-token: ${{ secrets.GITHUB_TOKEN }}
      # IPIR is the backend the memo fleet ships (see deploy-pir-fleet.yml), but the
      # other jobs either omit the feature or pass --lib, so nothing else runs
      # these integration tests. Release matters: the offline precomputation
      # takes minutes in a debug build.
      - name: IPIR integration tests
        run: >-
          cargo test
          -p spend-server
          -p witness-server
          -p spend-client
          --features ipir
          --release
          --test ipir_test --test end_to_end

  notify-slack:
    name: Slack Notification
    if: ${{ always() && github.ref == 'refs/heads/main' && github.event_name == 'push' && contains(join(needs.*.result, ','), 'failure') }}
    needs: [lint, test-nullifier, test-witness, test-memo, test-tree-correctness, test-pir-round-trip, test-ypir, test-ipir]
    runs-on: ubuntu-latest
    steps:
      - name: Notify Slack on failure
        uses: slackapi/slack-github-action@v2.1.0
        with:
          webhook: ${{ secrets.SLACK_WEBHOOK_URL }}
          webhook-type: incoming-webhook
          payload: |
            {
              "text": "CI failed on main",
              "blocks": [
                {
                  "type": "header",
                  "text": { "type": "plain_text", "text": "CI Failed on main", "emoji": true }
                },
                {
                  "type": "section",
                  "fields": [
                    { "type": "mrkdwn", "text": "*Repo:*\n<${{ github.server_url }}/${{ github.repository }}|${{ github.repository }}>" },
                    { "type": "mrkdwn", "text": "*Workflow:*\n<${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}|CI>" },
                    { "type": "mrkdwn", "text": "*Commit:*\n<${{ github.server_url }}/${{ github.repository }}/commit/${{ github.sha }}|`${{ github.sha }}`>" },
                    { "type": "mrkdwn", "text": "*Author:*\n${{ github.actor }}" }
                  ]
                },
                {
                  "type": "section",
                  "text": { "type": "mrkdwn", "text": "*Job Results:*\nLint: `${{ needs.lint.result }}` | Nullifier: `${{ needs.test-nullifier.result }}` | Witness: `${{ needs.test-witness.result }}` | Memo: `${{ needs.test-memo.result }}` | Tree: `${{ needs.test-tree-correctness.result }}` | PIR: `${{ needs.test-pir-round-trip.result }}` | YPIR: `${{ needs.test-ypir.result }}` | IPIR: `${{ needs.test-ipir.result }}`" }
                }
              ]
            }
