name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -Dwarnings -C target-cpu=x86-64-v3

jobs:
  lint-and-test:
    name: Enhance PIR
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.91.0
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets --all-features -- -D warnings
      - run: cargo test --workspace --release

  validate-ops:
    name: Validate Enhance operations
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check deployment shell
        run: shellcheck ops/scripts/deploy-enhance-pir.sh
      - name: Validate example inventory
        env:
          ENHANCE_COORDINATOR_HOST: coordinator.example.net
          ENHANCE_DEPLOY_USER: deploy
          ENHANCE_PUBLIC_URL: https://enhance.example.net
          ENHANCE_WORKERS_JSON: >-
            [{"name":"shard-group-01","replicas":[{"name":"worker-01a","ssh_host":"worker-01a.example.net","service_url":"http://10.0.0.2:8091"},{"name":"worker-01b","ssh_host":"worker-01b.example.net","service_url":"http://10.0.0.3:8091"}]}]
          TRANSPARENT_SPEND_WORKER_JSON: >-
            {"name":"transparent-spend-worker-01","ssh_host":"spend-worker.example.net","service_url":"http://10.0.0.4:8091"}
        run: ops/scripts/deploy-enhance-pir.sh validate
