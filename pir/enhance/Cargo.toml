[package]
name = "enhance-pir"
version = "0.1.0"
edition = "2021"

[lib]
name = "enhance_pir"
path = "src/lib.rs"

[[bin]]
name = "enhance-pir-cli"
path = "src/bin/client.rs"
required-features = ["cli"]

[features]
default = []
cli = ["dep:clap", "dep:tokio"]

[dependencies]
clap = { version = "4", features = ["derive"], optional = true }
hex = "0.4"
ipir-sp = { git = "https://github.com/valargroup/ipir-sp.git", rev = "e875404cef33661906ab60af236dfb327e6b28b1" }
rand = "0.8"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
thiserror = "2"
tokio = { version = "1", features = ["macros", "rt-multi-thread"], optional = true }
