[package]
name = "spend-client"
version = "0.1.0"
edition = "2021"

[features]
default = []
# YPIR is the default PIR backend: the client code selects it with
# `cfg(not(feature = "ipir"))`, so the `ypir` crate is a hard dependency and
# cannot be made optional. This feature exists to pull the matching backend
# into the `spend-server` dev-dependency for the end-to-end tests.
ypir = ["spend-server/ypir"]
ipir = ["dep:ipir-sp", "dep:inspiring", "spend-server/ipir"]
live = []

[dependencies]
spend-types = { path = "../spend-types" }
ypir = { package = "valar-ypir", git = "https://github.com/valargroup/ypir.git", branch = "valar/artifact", default-features = false }
ipir-sp = { git = "https://github.com/valargroup/ipir-sp.git", rev = "e875404cef33661906ab60af236dfb327e6b28b1", optional = true }
inspiring = { git = "https://github.com/valargroup/ipir-sp.git", rev = "e875404cef33661906ab60af236dfb327e6b28b1", optional = true }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
serde_json = "1"
tokio = { version = "1", features = ["full"] }
thiserror = "2"
tracing = "0.1"

[dev-dependencies]
spend-server = { path = "../spend-server" }
hashtable-pir = { path = "../hashtable-pir" }
nf-ingest = { path = "../nf-ingest" }
axum = "0.7"
tonic = "0.12"
tokio-stream = "0.1"
tempfile = "3"
