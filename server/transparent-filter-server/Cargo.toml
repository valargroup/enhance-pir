[package]
name = "transparent-filter-server"
version = "0.1.0"
edition = "2021"

[lib]
name = "transparent_filter_server"
path = "src/lib.rs"

[[bin]]
name = "transparent-filter-server"
path = "src/bin/server.rs"

[dependencies]
axum = "0.7"
clap = { version = "4", features = ["derive"] }
hex = "0.4"
prometheus = { version = "0.13", default-features = false, features = ["process"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tokio = { version = "1", features = ["full"] }
tower-http = { version = "0.5", features = ["limit", "trace"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
transparent-filter = { path = "../../pir/transparent-filter" }
zakura-chain = { git = "https://github.com/zakura-core/zakura.git", rev = "1faf150fc3648aae22c55a6b30f8f5a9b9ce934e" }

[dev-dependencies]
tempfile = "3"
tower = { version = "0.5", features = ["util"] }
